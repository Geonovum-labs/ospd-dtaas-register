$schema: https://json-schema.org/draft/2020-12/schema

type: object

required:
  - usedEntityType
  - generatedEntityType

properties:
  usedEntityType:
    type: string
    format: uri
    description: >-
      A type of prov:Entity that activities of this type use (prov:used)
      — for example a type of input dataset.

  generatedEntityType:
    type: string
    format: uri
    description: >-
      A type of prov:Entity that activities of this type generate
      (prov:generated) — for example a type of output product.

  associatedAgentType:
    type: string
    format: uri
    description: >-
      A type of prov:Agent (for example prov:Person, prov:SoftwareAgent,
      or a narrower role-bearing type) that activities of this type are
      associated with (prov:wasAssociatedWith).

  informedByActivityType:
    type: string
    format: uri
    description: >-
      A type of acttype:ActivityType whose instances typically inform
      activities of this type (prov:wasInformedBy) — for example an
      upstream preparation activity type.

unevaluatedProperties: true
