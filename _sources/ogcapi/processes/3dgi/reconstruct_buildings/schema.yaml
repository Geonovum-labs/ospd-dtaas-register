$schema: https://json-schema.org/draft/2020-12/schema

# Schema for Reconstruct Buildings process
# Extends the registered-item schema to include application package metadata

allOf:
  - $ref: "https://geonovum-labs.github.io/activity-type-register/build/annotated/register/schemas/geoprocessing-activity-types-schema/schema.yaml"
  - properties:
      "dct:identifier":
        type: string
        format: uri
      "dct:title":
        type: string
      "dct:description":
        type: string
      "dct:issued":
        type: string
        format: date
      "dct:modified":
        type: string
        format: date
      "apkg:hasInput":
        type: array
        items:
          type: string
      "apkg:hasOutput":
        type: array
        items:
          type: string
    required:
      - "dct:identifier"
      - "dct:title"
      - "dct:issued"
additionalProperties: true
