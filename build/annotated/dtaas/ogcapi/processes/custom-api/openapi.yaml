openapi: 3.1.0
info:
  title: OGC API - Processes 1.0 geonovum example
  version: 1.0.0
  description: This is an OGC API - Processes 1.0 implementation using Building Blocks
    for a DTaaS demo.
  contact:
    name: Geonovum
    email: info@geonovum.nl
    url: https://github.com/nielshoffmann
  license:
    name: Apache License, Version 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.txt
paths:
  /:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/paths/LandingPage/openapi.yaml
  /conformance:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/paths/Conformance/openapi.yaml
  /processes:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/paths/ProcessList/openapi.yaml
  /processes/{processID}:
    get:
      summary: retrieve a process description
      description: 'The process description contains information about inputs and
        outputs and a link to the execution-endpoint for the process. The Core does
        not mandate the use of a specific process description to specify the interface
        of a process. That said, the Core requirements class makes the following recommendation:


        Implementations SHOULD consider supporting the OGC process description.


        For more information, see [Section 7.10](https://docs.ogc.org/is/18-062/18-062.html#sc_process_description).

        '
      operationId: getProcessDescription
      tags:
      - ProcessDescription
      parameters:
      - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/parameters/processIdPathParam/openapi.yaml
      responses:
        200:
          content:
            application/json:
              examples:
                processDecription:
                  externalValue: ../../examples/json/ProcessDescription.json
                  summary: A Process Description example
              schema:
                allOf:
                - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/process/schema.yaml
                - allOf:
                  - {}
                  - type: object
                    properties:
                      inputs:
                        additionalProperties:
                          $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                          x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                          x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                      outputs:
                        additionalProperties:
                          $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                          x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                          x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
          description: A process description.
        404:
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/NotFound/schema.yaml
  /jobs:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/paths/JobList/openapi.yaml
  /processes/{processID}/execution:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/paths/Execution/openapi.yaml
  /jobs/{jobId}:
    $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/api/openapi.yaml
  /jobs/{jobId}/results:
    get:
      summary: retrieve the result(s) of a job
      description: 'Lists available results of a job. In case of a failure, lists
        exceptions instead.


        For more information, see [Section 7.13](https://docs.ogc.org/is/18-062/18-062.html#sc_retrieve_job_results).

        '
      operationId: getResult
      tags:
      - Result
      parameters:
      - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/parameters/jobId/openapi.yaml
      responses:
        '200':
          description: Job results
          content:
            application/json:
              schema:
                allOf:
                - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                - anyOf:
                  - allOf:
                    - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                      x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                      x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
                      allOf:
                      - properties:
                          additionalParameters:
                            allOf:
                            - properties:
                                href:
                                  type: string
                                role:
                                  type: string
                                title:
                                  type: string
                            - type: object
                              properties:
                                parameters:
                                  items:
                                    properties:
                                      name:
                                        type: string
                                      value:
                                        items:
                                          oneOf:
                                          - type: string
                                          - type: number
                                          - type: integer
                                          - type: array
                                            items: {}
                                          - type: object
                          description:
                            type: string
                          keywords:
                            items:
                              type: string
                          metadata:
                            items:
                              $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/metadata/schema.yaml
                          title:
                            type: string
                      - required:
                        - schema
                        type: object
                        properties:
                          schema:
                            oneOf:
                            - properties:
                                format: uri-reference
                                type: string
                            - type: object
                              properties:
                                additionalProperties:
                                  oneOf:
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                  - type: boolean
                                allOf:
                                - items:
                                    oneOf:
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                anyOf:
                                - items:
                                    oneOf:
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                contentEncoding:
                                  type: string
                                contentMediaType:
                                  type: string
                                contentSchema:
                                  type: string
                                default: {}
                                deprecated:
                                  default: false
                                  type: boolean
                                description:
                                  type: string
                                enum:
                                  items: {}
                                example: {}
                                exclusiveMaximum:
                                  default: false
                                  type: boolean
                                exclusiveMinimum:
                                  default: false
                                  type: boolean
                                format:
                                  type: string
                                items:
                                  oneOf:
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                maxItems:
                                  minimum: 0
                                  type: integer
                                maxLength:
                                  minimum: 0
                                  type: integer
                                maxProperties:
                                  minimum: 0
                                  type: integer
                                maximum:
                                  type: number
                                minItems:
                                  default: 0
                                  minimum: 0
                                  type: integer
                                minLength:
                                  default: 0
                                  minimum: 0
                                  type: integer
                                minProperties:
                                  default: 0
                                  minimum: 0
                                  type: integer
                                minimum:
                                  type: number
                                multipleOf:
                                  exclusiveMinimum: 0
                                  type: number
                                not:
                                  oneOf:
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                nullable:
                                  default: false
                                  type: boolean
                                oneOf:
                                - items:
                                    oneOf:
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                pattern:
                                  format: regex
                                  type: string
                                properties:
                                  additionalProperties:
                                    oneOf:
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/schema/schema.yaml
                                    - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/reference/schema.yaml
                                readOnly:
                                  default: false
                                  type: boolean
                                required:
                                  items:
                                    type: string
                                title:
                                  type: string
                                type:
                                  enum:
                                  - array
                                  - boolean
                                  - integer
                                  - number
                                  - object
                                  - string
                                  type: string
                                uniqueItems:
                                  default: false
                                  type: boolean
                                writeOnly:
                                  default: false
                                  type: boolean
                    properties:
                      schema:
                        properties:
                          output_dataset:
                            properties:
                              title:
                                type: string
                                const: Output Dataset
                              description:
                                type: string
                                const: output
                              schema:
                                $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/localoutlier/outputSchema/schema.yaml#/properties/output_dataset
        '404':
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/NotFound/schema.yaml
        '500':
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/ServerError/schema.yaml
  /processes/localoutlier:
    get:
      summary: Get localoutlier process description
      description: The local outlier factor (LOF) algorithm computes a score indicating
        the degree of abnormality of each input (observation), in a set of such observations.
        It measures the local density deviation of a given data point with respect
        to its neighbors.
      operationId: describeLocaloutlierProcess
      tags:
      - localoutlier
      parameters:
      - name: f
        in: query
        description: The optional f parameter indicates the output format which the
          server shall provide as part of the response document. The default format
          is GeoJSON.
        required: false
        style: form
        explode: false
        schema:
          type: string
          enum:
          - json
          - html
          - jsonld
          default: json
      responses:
        '200':
          description: Localoutlier process description
          content:
            application/json:
              schema:
                allOf:
                - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/localoutlier/processDescription/schema.yaml
                - allOf:
                  - allOf:
                    - {}
                    - type: object
                      properties:
                        inputs:
                          additionalProperties:
                            $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                        outputs:
                          additionalProperties:
                            $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
                  - properties:
                      inputs:
                        allOf:
                        - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                          x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                          x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                      outputs:
                        $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                        x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                        x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
        default:
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/ServerError/schema.yaml
  /processes/localoutlier/execution:
    post:
      summary: Execute localoutlier process
      description: Execute the local outlier factor (LOF) algorithm on a GeoJSON point
        dataset.
      operationId: executeLocaloutlierJob
      tags:
      - localoutlier
      parameters:
      - name: Prefer
        in: header
        required: false
        schema:
          type: string
          enum:
          - respond-async
        description: Execution preference (async or sync with timeout)
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
            example:
              inputs:
                dataset: https://example.com/data/points.geojson
                n_neighbors: 20
                leaf_size: 30
                output_column: abnormality
      responses:
        '200':
          description: Synchronous execution completed
          content:
            application/json:
              schema: {}
        '201':
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/ExecuteAsync/schema.yaml
        '404':
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/NotFound/schema.yaml
        '500':
          $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/responses/ServerError/schema.yaml
servers:
- description: Local development server
  url: http://localhost:5000
x-bblocks-extends: ogc.api.processes.v1.api
x-bblocks-extensions:
  ogc.api.processes.v1.schemas.inputDescription: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
  ogc.api.processes.v1.schemas.outputDescription: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
