  /processes/localoutlier:
    get:
      summary: Get localoutlier process description
      description: The local outlier factor (LOF) algorithm computes a score indicating
        the degree of abnormality of each input (observation), in a set of such observations.
        It measures the local density deviation of a given data point with respect
        to its neighbors.
      operationId: describeLocaloutlierProcess
      tags:
      - localoutlier
      parameters:
      - name: f
        in: query
        description: The optional f parameter indicates the output format which the
          server shall provide as part of the response document. The default format
          is GeoJSON.
        required: false
        style: form
        explode: false
        schema:
          type: string
          enum:
          - json
          - html
          - jsonld
          default: json
      responses:
        '200':
          description: Localoutlier process description
          content:
            application/json:
              schema:
                allOf:
                - allOf:
                  - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/localoutlier/processDescription/schema.yaml
                  - allOf:
                    - allOf:
                      - {}
                      - type: object
                        properties:
                          inputs:
                            additionalProperties:
                              $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                              x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                              x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                          outputs:
                            additionalProperties:
                              $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                              x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                              x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
                    - properties:
                        inputs:
                          allOf:
                          - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                        outputs:
                          $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                          x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                          x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
                - allOf:
