  /processes/{processID}:
    get:
      summary: retrieve a process description
      description: 'The process description contains information about inputs and
        outputs and a link to the execution-endpoint for the process. The Core does
        not mandate the use of a specific process description to specify the interface
        of a process. That said, the Core requirements class makes the following recommendation:


        Implementations SHOULD consider supporting the OGC process description.


        For more information, see [Section 7.10](https://docs.ogc.org/is/18-062/18-062.html#sc_process_description).

        '
      operationId: getProcessDescription
      tags:
      - ProcessDescription
      parameters:
      - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/parameters/processIdPathParam/openapi.yaml
      responses:
        200:
          content:
            application/json:
              examples:
                processDecription:
                  externalValue: ../../examples/json/ProcessDescription.json
                  summary: A Process Description example
              schema:
                allOf:
                - allOf:
                  - $ref: https://ogcincubator.github.io/bblocks-ogcapi-processes/build/annotated/api/processes/v1/schemas/process/schema.yaml
                  - allOf:
                    - {}
                    - type: object
                      properties:
                        inputs:
                          additionalProperties:
                            $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                        outputs:
                          additionalProperties:
                            $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/outputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.outputDescriptions
                - allOf:
                  - allOf:
                    - {}
                    - type: object
                      properties:
                        inputs:
                          additionalProperties:
                            $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                            x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                        outputs:
                          additionalProperties:
                            $ref: https://ogcincubator.github.io/bblocks-openscience/build/annotated/osc/api-profiles/processes/ipt/results/schema.yaml
                            x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                            x-bblocks-extension-target: ogc.osc.api-profiles.processes.ipt.results
                  - allOf:
                    - {}
                    - type: object
                      properties:
                        inputs:
                          additionalProperties:
                            anyOf:
                            - allOf:
                              - $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/inputDescriptions/schema.yaml
                                x-bblocks-extension-source: ogc.api.processes.v1.schemas.inputDescription
                                x-bblocks-extension-target: geonovum.dtaas.ogcapi.processes.schemas.inputDescriptions
                              properties:
                                dataset:
                                  properties:
                                    title:
                                      type: string
                                      const: Dataset
                                    description:
                                      type: string
                                      const: geojson dataset of points, in one CRS,
                                        for which LOF scores should be computed.
                                    minOccurs:
                                      type: integer
                                      const: 1
                                    maxOccurs:
                                      type: integer
                                      const: 1
                                    schema:
                                      $ref: https://geonovum-labs.github.io/ospd-dtaas-register/build/annotated/dtaas/ogcapi/processes/schemas/localoutlier/inputSchema/schema.yaml#/properties/dataset
                                n_neighbors:
                                  properties:
                                    title:
                                      type: string
                                      const: Number of neighbors
                                    description:
                                      type: string
                                      const: Number of neighbors to use by default
                                        for `kneighbors` queries. If `n_neighbors`
                                        is larger than the number of samples provided,
                                        all samples will be used.
                                    minOccurs:
                                      type: integer
                                      const: 0
                                    maxOccurs:
                                      type: integer
                                      const: 1
                                    schema:
                                      oneOf:
                                      - type: integer
                                leaf_size:
                                  properties:
                                    title:
                                      type: string
                                      const: Leaf size
                                    description:
                                      type: string
                                      const: Leaf size passed to BallTree or KDTree.
                                        This can affect the speed of the construction
                                        and query, as well as the memory required
                                        to store the tree.
                                    minOccurs:
                                      type: integer
                                      const: 0
                                    maxOccurs:
                                      type: integer
                                      const: 1
                                    schema:
                                      oneOf:
                                      - type: integer
                                output_column:
                                  properties:
                                    title:
                                      type: string
                                      const: Output column name
                                    description:
                                      type: string
                                      const: Name of the column in which to store
                                        output metric. If this column exists, an error
                                        will be thrown
                                    minOccurs:
                                      type: integer
                                      const: 0
                                    maxOccurs:
                                      type: integer
                                      const: 1
                                    schema:
                                      oneOf:
                                      - type: string
                        outputs:
                          additionalProperties:
                            anyOf:
                            - allOf:
                              - $ref: https://ogcincubator.github.io/bblocks-openscience/build/annotated/osc/api-profiles/processes/ipt/results/schema.yaml
                                x-bblocks-extension-source: ogc.api.processes.v1.schemas.outputDescription
                                x-bblocks-extension-target: ogc.osc.api-profiles.processes.ipt.results
